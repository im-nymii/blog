<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" type="image/png" href="https://github.com/{{ site.github_username }}.png">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Griffy&display=swap" rel="stylesheet">
    {% seo %}
</head>
<body>
    <header class="topbar">
        <a class="logo" href="{{ '/' | relative_url }}">
            <span class="logo-mark">[</span>nymii<span class="logo-mark">]</span>
            <span class="logo-blip"></span>
        </a>
        <nav class="nav">
            <a href="{{ '/' | relative_url }}">home</a>
            <a href="{{ '/posts' | relative_url }}">posts</a>
            <a href="https://nymii.dev" target="_blank" rel="noreferrer">nymii.dev</a>
            <a class="nav-cta" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noreferrer">github ↗</a>
        </nav>
        <button class="nav-toggle" aria-label="menu" onclick="document.getElementById('drawer').classList.toggle('open')">≡</button>
    </header>

    <div class="nav-drawer" id="drawer">
        <a href="{{ '/' | relative_url }}">home</a>
        <a href="{{ '/posts' | relative_url }}">posts</a>
        <a href="https://nymii.dev" target="_blank" rel="noreferrer">nymii.dev</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noreferrer">github</a>
    </div>

    <main>
        {{ content }}
    </main>

    <footer class="foot">
        <div class="foot-grid">
            <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noreferrer">github</a>
            <a href="https://nymii.dev" target="_blank" rel="noreferrer">nymii.dev</a>
            <a href="{{ '/posts' | relative_url }}">posts</a>
        </div>
        <p class="foot-sign">{{ site.author }} — {{ 'now' | date: "%Y" }} <span class="dim">— chaos, chaos!</span></p>
    </footer>
</body>
</html>
